<!DOCTYPE html>
<html>
    <head>
        <title>Content models</title>
    </head>
    <body>
        <h1>HTML Content Models</h1>
        <!--flow content-->
        <div>
            <p>This is flow content</p>
        </div>
        <!--sectionContent-->
        <section>
            <h2>section</h2>
        </section>
        <!--heading content-->
        <h3>Heading Example</h3>
        <!--phrasing content-->
        <p>this is<b>bold</b>text</p>
        <!--embedded content-->
        <img src="image.jpg"alt="img">
        <!--interactive content-->
        <a href="#">Click</a>
        <button>Submit</button>
    </body>
</html>
